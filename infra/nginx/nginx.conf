# Единая точка входа: статика веб-панели, прокси /api на контейнер api, раздача APK.
# TLS не настроен — открытый вопрос №4 проектного документа (внутренний CA или самоподписанный сертификат).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_read_timeout 60s;
        client_max_body_size 20m; # Excel-импорт
    }

    # Android-приложение раздаётся с собственного сервера (этап 9). Том монтируется пустым.
    location /apk/ {
        alias /srv/apk/;
        autoindex off;
        types { application/vnd.android.package-archive apk; }
    }

    # Хешированные ассеты Vite — кешировать год
    location ~* \.(?:js|css|woff2|png|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # index.html не кешируется, чтобы обновления доходили сразу
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy same-origin always;
    }

    # SPA: любой путь отдаёт index.html, маршрутизация на клиенте
    location / {
        try_files $uri /index.html;
    }
}
