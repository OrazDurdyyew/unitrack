# Команды бэкенда. Вызываются из корня как `task backend:<имя>`.
version: '3'

vars:
  GOBIN:
    sh: echo "$(go env GOPATH)/bin"
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo dev
  GOVER:
    sh: awk '/^go /{print $2}' go.mod

tasks:
  tools:
    desc: Установить инструменты Go (линтер, форматтер, sqlc, goose) тем же toolchain, что в go.mod
    env:
      GOTOOLCHAIN: 'go{{.GOVER}}'
    cmds:
      - go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.6.2
      - go install mvdan.cc/gofumpt@v0.8.0
      - go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.30.0
      - go install github.com/pressly/goose/v3/cmd/goose@v3.26.0

  gen:
    desc: Сгенерировать код из контракта и SQL
    cmds:
      - go generate ./...

  fmt:
    desc: Отформатировать код
    cmds:
      - '{{.GOBIN}}/gofumpt -w .'

  lint:
    desc: Линтер и проверка форматирования
    cmds:
      - go mod tidy -diff
      - '{{.GOBIN}}/golangci-lint run ./...'

  test:
    desc: Тесты с детектором гонок
    cmds:
      - go test -race -count=1 ./...
    env:
      CGO_ENABLED: '1'

  build:
    desc: Собрать бинарник в bin/api
    cmds:
      - go build -ldflags "-s -w -X main.version={{.VERSION}}" -o bin/api ./cmd/api
    env:
      CGO_ENABLED: '0'

  dev:
    desc: Запустить API локально (нужны переменные UNITRACK_*)
    cmds:
      - go run ./cmd/api
