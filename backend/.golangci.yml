# Настройки golangci-lint v2. Правила — в backend/CLAUDE.md.
version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    - govet
    - errcheck
    - staticcheck
    - unused
    - revive
    - gocritic
    - errorlint
    - noctx
    - bodyclose
    - sqlclosecheck
    - exhaustive
    - gosec
    - unparam
    - misspell
  settings:
    revive:
      rules:
        - name: exported
          disabled: true
    gosec:
      excludes:
        - G104 # дублирует errcheck
  exclusions:
    paths:
      - internal/api/gen
    rules:
      - path: _test\.go
        linters: [gosec, noctx, bodyclose, errcheck]

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/OrazDurdyyew/unitrack
  exclusions:
    paths:
      - internal/api/gen
